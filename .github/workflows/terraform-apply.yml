name: terraform-apply

on:
  push:
    branches: [main]

permissions:
  id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # 意図的に mcp-test のみ。odds-resolver は plan だけを CI に載せ、apply は手元に置く。
    # 自動 apply には IAM CreateRole/PassRole を CI ロールへ渡す必要があり、
    # 「CI が自分より強い権限を作れる」経路になるため（#15）。
    defaults:
      run:
        working-directory: mcp-test
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::417441750247:role/github-actions-terraform-apply
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init

      - run: terraform apply -auto-approve -input=false
