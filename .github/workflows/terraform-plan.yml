name: terraform-plan

on:
  pull_request:

permissions:
  id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
  contents: read
  pull-requests: write # required to post the plan result as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 片方の失敗でもう片方の plan 結果を隠さない
      matrix:
        directory: [mcp-test, odds-resolver]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::417441750247:role/github-actions-terraform-plan
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform init

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan result to PR
        uses: actions/github-script@v7
        env:
          DIRECTORY: ${{ matrix.directory }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.DIRECTORY;
            const output = fs.readFileSync(`${dir}/plan_output.txt`, 'utf8');
            const truncated = output.length > 60000
              ? output.slice(0, 60000) + '\n\n... (truncated)'
              : output;
            // ディレクトリごとに 1 コメントを維持するための目印。
            // 同じ PR に push し直しても増殖させず、既存を更新する。
            const marker = `<!-- terraform-plan:${dir} -->`;
            const status = process.env.OUTCOME === 'failure' ? '失敗' : '成功';
            const body = [
              marker,
              `#### Terraform Plan — \`${dir}\`（${status}）`,
              '```',
              truncated,
              '```',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
